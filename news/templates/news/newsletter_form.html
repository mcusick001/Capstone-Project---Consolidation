{% extends 'news/base.html' %}
{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <h2>{% if newsletter %}Edit Newsletter{% else %}Create New Newsletter{% endif %}</h2>
    <form method="post" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Newsletter</button>
        <a href="{% url 'editor_dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
